name: AlphaAsk Teardown Infrastructure Pipeline

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type "DESTROY" to confirm teardown of all production AWS infrastructure'
        required: true
        default: ''

jobs:
  teardown-infrastructure:
    name: Teardown & Destroy Production AWS Infrastructure
    runs-on: ubuntu-latest

    steps:
      - name: Validate Confirmation Input
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "Confirmation input mismatch. Aborting infrastructure teardown."
            exit 1
          fi
        shell: bash

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Empty S3 Frontend Bucket Before Destruction
        run: |
          aws s3 rm s3://alphaask-frontend-static-dev --recursive || echo "S3 bucket already empty or missing"

      - name: Force Delete ECR Repository & Container Images
        run: |
          aws ecr delete-repository --repository-name alphaask-backend --force || echo "ECR repository already empty or removed"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: |
          cd infra/terraform
          terraform init

      - name: Terraform Destroy Infrastructure
        run: |
          cd infra/terraform
          terraform destroy -auto-approve

