name: AlphaAsk Serverless CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Stage 1: Test & Validate Code (Backend, Frontend, Terraform)
  test-and-validate:
    name: 1. Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Pytest
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
          JWT_SECRET_KEY: alphaask-ci-test-only-secret-not-for-production-use
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Check Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform Configuration
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # Stage 2: Provision Foundational ECR Infrastructure
  provision-base-infra:
    name: 2. Provision ECR Repository
    needs: test-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr create-repository --repository-name alphaask-backend --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE || echo "ECR repository already exists"

  # Stage 3: Build & Push Backend Container Image
  build-and-push-container:
    name: 3. Build & Push Docker Image
    needs: provision-base-infra
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: alphaask-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build --provenance=false --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Stage 4: Deploy Application Infrastructure & Frontend Web Assets
  deploy-app-and-frontend:
    name: 4. Deploy Infrastructure & Frontend Assets
    needs: build-and-push-container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev' || startsWith(github.ref, 'refs/heads/feat/'))
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Import Existing Resources into State
        run: |
          cd infra/terraform
          terraform init
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text 2>/dev/null || echo "")

          set +e

          # ECR & IAM
          if aws ecr describe-repositories --repository-names alphaask-backend >/dev/null 2>&1; then
            terraform import -lock=false aws_ecr_repository.backend alphaask-backend
          fi

          if aws iam get-role --role-name alphaask-lambda-exec-role >/dev/null 2>&1; then
            terraform import -lock=false aws_iam_role.lambda_exec alphaask-lambda-exec-role
          fi

          if [ -n "$ACCOUNT_ID" ] && aws iam get-policy --policy-arn arn:aws:iam::${ACCOUNT_ID}:policy/alphaask-services-policy >/dev/null 2>&1; then
            terraform import -lock=false aws_iam_policy.lambda_services_access arn:aws:iam::${ACCOUNT_ID}:policy/alphaask-services-policy || true
            terraform import -lock=false aws_iam_role_policy_attachment.lambda_basic_execution alphaask-lambda-exec-role/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true
            terraform import -lock=false aws_iam_role_policy_attachment.lambda_services_attach alphaask-lambda-exec-role/arn:aws:iam::${ACCOUNT_ID}:policy/alphaask-services-policy || true
            terraform import -lock=false aws_iam_role_policy_attachment.lambda_vpc_access alphaask-lambda-exec-role/arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole || true
          fi

          # DynamoDB Tables
          for TBL in Users Sessions Messages Questions FAQ; do
            if aws dynamodb describe-table --table-name alphaask-$TBL >/dev/null 2>&1; then
              RNAME=$(echo "$TBL" | tr '[:upper:]' '[:lower:]')
              terraform import -lock=false aws_dynamodb_table.$RNAME alphaask-$TBL || true
            fi
          done

          # Lambda Function
          if aws lambda get-function --function-name alphaask-backend >/dev/null 2>&1; then
            terraform import -lock=false aws_lambda_function.backend alphaask-backend || true
          fi

          # Lambda Security Group
          LAMBDA_SG_ID=$(aws ec2 describe-security-groups --group-names alphaask-lambda-sg --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || true)
          if [ -n "$LAMBDA_SG_ID" ] && [ "$LAMBDA_SG_ID" != "None" ]; then
            terraform import -lock=false aws_security_group.lambda_sg $LAMBDA_SG_ID || true
          fi

          # S3 Bucket & Policy
          BUCKET_NAME=$(aws s3api list-buckets --query "Buckets[?starts_with(Name, 'alphaask-frontend-static') || Name=='alphaask.alphateam.live'].Name | [0]" --output text 2>/dev/null || echo "")
          if [ -n "$BUCKET_NAME" ] && [ "$BUCKET_NAME" != "None" ]; then
            terraform import -lock=false aws_s3_bucket.frontend $BUCKET_NAME || true
            terraform import -lock=false aws_s3_bucket_public_access_block.frontend_public $BUCKET_NAME || true
            terraform import -lock=false aws_s3_bucket_website_configuration.frontend_website $BUCKET_NAME || true
            terraform import -lock=false aws_s3_bucket_policy.frontend_policy $BUCKET_NAME || true
          fi

          # Empty old legacy bucket if it exists to allow clean destruction/migration
          if aws s3api head-bucket --bucket alphaask-frontend-static-dev >/dev/null 2>&1; then
            echo "Emptying legacy S3 bucket alphaask-frontend-static-dev..."
            aws s3 rm s3://alphaask-frontend-static-dev --recursive || true
          fi

          # ElastiCache Redis & Security Group
          SG_ID=$(aws ec2 describe-security-groups --group-names alphaask-elasticache-sg --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || true)
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            terraform import -lock=false aws_security_group.elasticache_sg $SG_ID || true
          fi

          if aws elasticache describe-cache-clusters --cache-cluster-id alphaask-redis >/dev/null 2>&1; then
            terraform import -lock=false aws_elasticache_cluster.redis alphaask-redis
          fi

          # API Gateway, Stage, Integrations & Routes
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='alphaask-api'].ApiId | [0]" --output text 2>/dev/null || true)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import -lock=false aws_apigatewayv2_api.http_api $API_ID
            terraform import -lock=false aws_apigatewayv2_stage.default $API_ID/\$default

            INTEG_ID=$(aws apigatewayv2 get-integrations --api-id $API_ID --query "Items[0].IntegrationId" --output text 2>/dev/null || true)
            if [ -n "$INTEG_ID" ] && [ "$INTEG_ID" != "None" ]; then
              terraform import -lock=false aws_apigatewayv2_integration.lambda_integration $API_ID/$INTEG_ID
            fi

            ANY_ROUTE_ID=$(aws apigatewayv2 get-routes --api-id $API_ID --query "Items[?RouteKey=='ANY /{proxy+}'].RouteId | [0]" --output text 2>/dev/null || true)
            if [ -n "$ANY_ROUTE_ID" ] && [ "$ANY_ROUTE_ID" != "None" ]; then
              terraform import -lock=false aws_apigatewayv2_route.any_route $API_ID/$ANY_ROUTE_ID
            fi

            DEF_ROUTE_ID=$(aws apigatewayv2 get-routes --api-id $API_ID --query "Items[?RouteKey=='\$default'].RouteId | [0]" --output text 2>/dev/null || true)
            if [ -n "$DEF_ROUTE_ID" ] && [ "$DEF_ROUTE_ID" != "None" ]; then
              terraform import -lock=false aws_apigatewayv2_route.default_route $API_ID/$DEF_ROUTE_ID
            fi
          fi
          terraform import -lock=false aws_lambda_permission.apigw_permission alphaask-backend/AllowExecutionFromAPIGateway || true
          terraform import -lock=false aws_cloudwatch_event_rule.keep_warm alphaask-keep-warm || true
          terraform import -lock=false aws_cloudwatch_event_target.keep_warm_lambda alphaask-keep-warm/AlphaAskKeepWarm || true
          terraform import -lock=false aws_lambda_permission.allow_eventbridge_keep_warm alphaask-backend/AllowEventBridgeKeepWarm || true

          set -e

      - name: Terraform Apply Full Infrastructure
        env:
          TF_VAR_jwt_secret_key: ${{ secrets.JWT_SECRET_KEY }}
          TF_VAR_gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          TF_VAR_groq_api_key: ${{ secrets.GROQ_API_KEY }}
          TF_VAR_openrouter_api_key: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd infra/terraform
          terraform apply -auto-approve

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update AWS Lambda Code
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: alphaask-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name alphaask-backend \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set up Node.js 20 & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Frontend Build to S3
        run: |
          cd infra/terraform
          API_URL=$(terraform output -raw api_gateway_url 2>/dev/null || echo "")
          S3_BUCKET=$(terraform output -raw frontend_s3_bucket 2>/dev/null || echo "alphaask.alphateam.live")
          echo "Injected API Gateway URL: $API_URL"
          echo "Target S3 Bucket: $S3_BUCKET"
          cd ../../frontend
          npm ci
          VITE_API_BASE_URL="$API_URL" npm run build
          aws s3 sync dist/ s3://$S3_BUCKET --delete
