name: AlphaAsk Serverless CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  # Stage 1: Test & Validate Code (Backend, Frontend, Terraform)
  test-and-validate:
    name: 1. Test & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Backend Dependencies & Run Pytest
        env:
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_DEFAULT_REGION: us-east-1
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pytest

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies & Check Build
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Validate Terraform Configuration
        run: |
          cd infra/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

  # Stage 2: Provision Foundational ECR Infrastructure
  provision-base-infra:
    name: 2. Provision ECR Repository
    needs: test-and-validate
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Ensure ECR Repository Exists
        run: |
          aws ecr create-repository --repository-name alphaask-backend --image-scanning-configuration scanOnPush=true --image-tag-mutability MUTABLE || echo "ECR repository already exists"

  # Stage 3: Build & Push Backend Container Image
  build-and-push-container:
    name: 3. Build & Push Docker Image
    needs: provision-base-infra
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push Backend Docker Image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: alphaask-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          cd backend
          docker build --provenance=false --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  # Stage 4: Deploy Application Infrastructure & Frontend Web Assets
  deploy-app-and-frontend:
    name: 4. Deploy Infrastructure & Frontend Assets
    needs: build-and-push-container
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init & Import Existing Resources into State
        run: |
          cd infra/terraform
          terraform init
          ACCOUNT_ID=$(aws sts get-caller-identity --query "Account" --output text 2>/dev/null || echo "")

          # ECR & IAM
          terraform import -lock=false aws_ecr_repository.backend alphaask-backend || true
          terraform import -lock=false aws_iam_role.lambda_exec alphaask-lambda-exec-role || true
          if [ -n "$ACCOUNT_ID" ]; then
            terraform import -lock=false aws_iam_policy.lambda_services_access arn:aws:iam::${ACCOUNT_ID}:policy/alphaask-services-policy || true
            terraform import -lock=false aws_iam_role_policy_attachment.lambda_basic_execution alphaask-lambda-exec-role/arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole || true
            terraform import -lock=false aws_iam_role_policy_attachment.lambda_services_attach alphaask-lambda-exec-role/arn:aws:iam::${ACCOUNT_ID}:policy/alphaask-services-policy || true
          fi

          # DynamoDB Tables
          terraform import -lock=false aws_dynamodb_table.users alphaask-Users || true
          terraform import -lock=false aws_dynamodb_table.sessions alphaask-Sessions || true
          terraform import -lock=false aws_dynamodb_table.messages alphaask-Messages || true
          terraform import -lock=false aws_dynamodb_table.questions alphaask-Questions || true
          terraform import -lock=false aws_dynamodb_table.faq alphaask-FAQ || true

          # Lambda Function
          terraform import -lock=false aws_lambda_function.backend alphaask-backend || true

          # S3 Bucket & Policy
          terraform import -lock=false aws_s3_bucket.frontend alphaask-frontend-static-dev || true
          terraform import -lock=false aws_s3_bucket_public_access_block.frontend_public alphaask-frontend-static-dev || true
          terraform import -lock=false aws_s3_bucket_website_configuration.frontend_website alphaask-frontend-static-dev || true
          terraform import -lock=false aws_s3_bucket_policy.frontend_policy alphaask-frontend-static-dev || true

          # ElastiCache Redis & Security Group
          SG_ID=$(aws ec2 describe-security-groups --group-names alphaask-elasticache-sg --query "SecurityGroups[0].GroupId" --output text 2>/dev/null || true)
          if [ -n "$SG_ID" ] && [ "$SG_ID" != "None" ]; then
            terraform import -lock=false aws_security_group.elasticache_sg $SG_ID || true
          fi
          terraform import -lock=false aws_elasticache_cluster.redis alphaask-redis || true

          # API Gateway
          API_ID=$(aws apigatewayv2 get-apis --query "Items[?Name=='alphaask-api'].ApiId | [0]" --output text 2>/dev/null || true)
          if [ -n "$API_ID" ] && [ "$API_ID" != "None" ]; then
            terraform import -lock=false aws_apigatewayv2_api.http_api $API_ID || true
            terraform import -lock=false aws_apigatewayv2_stage.default $API_ID/\$default || true
          fi

      - name: Terraform Apply Full Infrastructure
        run: |
          cd infra/terraform
          terraform apply -auto-approve

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Update AWS Lambda Code
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: alphaask-backend
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws lambda update-function-code \
            --function-name alphaask-backend \
            --image-uri $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Set up Node.js 20 & Build Frontend
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy Frontend Build to S3
        run: |
          cd frontend
          npm ci
          npm run build
          aws s3 sync dist/ s3://alphaask-frontend-static-dev --delete
