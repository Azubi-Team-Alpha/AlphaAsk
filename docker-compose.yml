services:
  # ==================== BACKEND ====================
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    volumes:
      - ./app:/code/app
      - ~/.aws:/root/.aws:ro
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    networks:
      - app-network

  # ==================== FRONTEND ====================
  frontend:
    build: ./frontend
    ports:
      - "3000:5173"                    # Access at http://localhost:3000
    volumes:
      - ./frontend:/app                # Mount code for hot reload
      - /app/node_modules              # Keep node_modules inside container
    environment:
      - VITE_API_URL=http://app:8000   # Use service name, not localhost!
    depends_on:
      - app
    networks:
      - app-network

  # ==================== DATABASE ====================
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: studentsupport
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  # ==================== CACHE ====================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network

# ==================== NETWORKS ====================
networks:
  app-network:
    driver: bridge

# ==================== VOLUMES ====================
volumes:
  pgdata:
